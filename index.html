<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DYNAMO</title>
<!-- The front door is the RACING now. The walking block still exists — it is
     one click away at block.html — but you arrive at the circuits, instantly,
     with no voxel build between you and picking a race. -->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #0a0e18; overflow: hidden;
    font: 500 13px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #b9c3d4;
  }
  #bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(255, 162, 60, .14), transparent 60%),
      radial-gradient(ellipse 70% 50% at 20% -10%, rgba(59, 83, 127, .35), transparent 60%),
      linear-gradient(#0a0e18, #0d1322);
  }
  /* a road that runs to the horizon, in pure CSS, because the menu should
     not need a 20-second build to say what the game is */
  #road {
    position: fixed; left: 50%; bottom: -12vh; width: 46vh; height: 62vh;
    transform: translateX(-50%) perspective(300px) rotateX(55deg);
    transform-origin: bottom;
    background:
      repeating-linear-gradient(#0000 0 44px, #ffc98a55 44px 70px) 50% 0 / 6px 100% no-repeat,
      linear-gradient(90deg, #ffc98a33 0 4px, #0000 4px calc(100% - 4px), #ffc98a33 calc(100% - 4px)),
      #131b2c;
    animation: roll 1.6s linear infinite;
    opacity: .5;
  }
  @keyframes roll { to { background-position: 50% 114px, 0 0; } }
  #title {
    position: fixed; top: 9vh; left: 0; right: 0; text-align: center; pointer-events: none;
  }
  #title h1 {
    margin: 0; font-size: 64px; font-weight: 700; letter-spacing: .32em; color: #f6ecda;
    text-shadow: 0 0 22px rgba(255, 201, 138, .5);
  }
  #title p { margin: 8px 0 0; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #6d7688; }
  #garagebtn {
    position: fixed; left: 22px; bottom: 20px; z-index: 80;
    background: none; border: 1px solid #232d3f; border-radius: 6px; color: #8d97ab;
    font: inherit; letter-spacing: .18em; text-transform: uppercase; font-size: 11px;
    padding: 10px 16px; cursor: pointer;
  }
  #garagebtn:hover { border-color: #ffd9a0; color: #ffd9a0; }
  /* the track picker mounts itself as an overlay; on this page it IS the menu,
     so its backdrop goes transparent and it sits above the fold */
  #pick { background: none !important; backdrop-filter: none !important; }
  #pick .card { margin-top: 17vh; }
  /* the page title does the announcing here */
  #pick h2, #pick .sub { display: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="road"></div>
<div id="title"><h1>DYNAMO</h1><p>night racing &middot; the town of echo block</p></div>
<button id="garagebtn">garage</button>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
<script type="module">
import { mountTrackSelect } from './src/track-select.js';
import { mountGarage } from './src/garage-ui.js';
import * as Garage from './src/race/garage.js';
import { createMusic } from './src/music.js';

const save = Garage.load();
const picker = mountTrackSelect({
  save,
  onGo: (t, m) => { location.href = './race.html?track=' + t.id + (m === 'tt' ? '&mode=tt' : ''); },
  closeLabel: 'walk the block instead →',
  onClose: () => { location.href = './block.html'; },
});
picker.show();

const garage = mountGarage({ save, closeHint: 'ESC to close' });
document.getElementById('garagebtn').addEventListener('click', () => garage.open());

// the mellow half of the radio, once the browser allows it
const music = createMusic();
const startMusic = () => {
  music.start('menu');
  removeEventListener('pointerdown', startMusic);
  removeEventListener('keydown', startMusic);
};
addEventListener('pointerdown', startMusic);
addEventListener('keydown', startMusic);
</script>
</body>
</html>
