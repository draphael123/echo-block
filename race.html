<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DYNAMO — the circuit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  /* THE DASH.
     The old one was a debug overlay wearing a HUD's clothes: every key in the
     game listed in the corner, a console hint on screen, and everything in
     letterspaced uppercase monospace including things that are not text. This
     is meant to read as an instrument binnacle from 1986 — a big soft-edged
     speed readout, a small amber strip for the lap, and nothing else unless
     you ask for it. */
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font: 500 12px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #b9c3d4;
    text-shadow: 0 1px 4px rgba(0,0,0,.85);
  }
  #ui > * { position: absolute; }

  /* speed, bottom left, on its own and large enough to read peripherally */
  #dash { left: 30px; bottom: 26px; }
  #speed {
    font: 300 62px/.82 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #f6ecda; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  #speed::after {
    content: 'km/h'; font-size: 11px; font-weight: 600; color: #6d7688;
    letter-spacing: .22em; margin-left: 9px; vertical-align: 14px;
  }
  #gear { color: #ffc98a; font: 600 14px/1 sans-serif; letter-spacing: .3em; min-height: 15px; margin-top: 7px; }
  #drift {
    color: #ff9a5c; font: 700 10px/1 sans-serif; letter-spacing: .4em;
    opacity: 0; transition: opacity .1s; margin-top: 3px;
  }
  #drift.on { opacity: 1; }
  #drift.t1 { color: #6fa8ff; }
  #drift.t2 { color: #ffa04c; }
  #drift.t3 { color: #d182ff; }

  /* the lap strip, top right */
  #clock { right: 30px; top: 24px; text-align: right; }
  #time {
    font: 300 34px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #f6ecda; font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  #lap { font-size: 10px; font-weight: 600; letter-spacing: .28em; color: #7f8a9c; margin-top: 4px; }
  #best { font-size: 10px; color: #5d6678; letter-spacing: .1em; margin-top: 3px; }
  #pos { font: 700 12px/1 sans-serif; letter-spacing: .16em; color: #9ce0a8; margin-top: 8px; }
  #pos.behind { color: #ff8a6a; }
  #delta { font: 700 13px/1 "Helvetica Neue", sans-serif; letter-spacing: .06em; margin-top: 4px; }
  #delta.up { color: #7fe08a; }
  #delta.down { color: #ff8a6a; }
  /* the pre-race card */
  #introcard {
    position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
    text-align: center; color: #b9c3d4; pointer-events: none;
    font: 500 13px/1.6 "Helvetica Neue", sans-serif;
  }
  #introcard h1 { margin: 0; font-size: 34px; font-weight: 400; color: #f6ecda; letter-spacing: .04em; }
  #introcard p { margin: 2px 0 8px; color: #8d97ab; }
  #introcard .facts { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #6d7688; }
  /* the results board */
  #results {
    position: fixed; inset: 0; display: grid; place-content: center;
    background: rgba(4, 7, 14, .6); z-index: 40;
    font: 500 13px/1.6 "Helvetica Neue", sans-serif; color: #b9c3d4;
  }
  #results.hidden { display: none; }
  #results .rcard {
    width: min(420px, 90vw); padding: 22px 26px;
    background: rgba(10, 14, 24, .92); border: 1px solid #2a3350; border-radius: 8px;
  }
  #results h2 { margin: 0 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .3em; color: #6d7688; text-transform: uppercase; }
  #results .rhead { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 24px; color: #f6ecda; margin-bottom: 14px; }
  #results .rhead b { font-size: 14px; color: #ffc98a; font-weight: 600; }
  #results .rrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px;
    padding: 5px 8px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  #results .rrow i { font-style: normal; color: #6d7688; }
  #results .rrow b { font-weight: 600; color: #d8dfeb; }
  #results .rrow.you { background: rgba(127, 224, 138, .1); color: #d6f5da; }
  #results .rrow.you b { color: #7fe08a; }
  #results .rmeta { margin-top: 12px; color: #6d7688; font-size: 11px; letter-spacing: .04em; }
  #results .rtable { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 14px; margin-top: 12px;
    padding-top: 10px; border-top: 1px solid #232d3f; }
  #results .rtable span { display: flex; justify-content: space-between; font-size: 11px; color: #8d97ab; }
  #results .rtable span b { color: #d8dfeb; }
  #results .rtable span.you, #results .rtable span.you b { color: #7fe08a; }
  #results .rnext { margin-top: 8px; color: #ffc98a; font-size: 12px; }
  #results .rhint { margin-top: 14px; color: #6d7688; font-size: 11px; letter-spacing: .12em; }
  #results .rhint b { color: #b9c3d4; }
  #boottrack {
    width: 240px; height: 3px; margin-top: 14px;
    background: #1c2336; border-radius: 2px; overflow: hidden;
  }
  #bootbar { width: 0; height: 100%; background: #ffc98a; transition: width .2s; }
  /* the minimap: the circuit's true shape with everybody on it */
  #map {
    position: fixed; right: 18px; bottom: 18px; width: 150px; height: 150px;
    opacity: .85; pointer-events: none;
  }

  /* The order board. Five other cars in the dark are a set of tail lights;
     a list of names is a field you are working through. */
  #board {
    position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 3px; text-align: right;
    font: 500 11px/1.5 Helvetica, Arial, sans-serif; letter-spacing: .1em;
    color: #6d7688; text-transform: lowercase; pointer-events: none;
  }
  #board .you { color: #f6ecda; font-weight: 700; }

  /* where you are, top left, quiet unless the lights are out */
  #where { left: 30px; top: 24px; }
  #circuit { font-size: 10px; font-weight: 700; letter-spacing: .3em; color: #6d7688; }
  #sect { font-size: 14px; font-weight: 500; letter-spacing: .06em; color: #aebbcd; margin-top: 4px; }
  #sect.dark { color: #ffb45c; }
  #sect.dark::after { content: ' \00b7 no lights'; font-size: 10px; letter-spacing: .18em; opacity: .75; }

  #msg {
    left: 0; right: 0; top: 42%; text-align: center; color: #93a0b4;
    font-size: 13px; letter-spacing: .22em; font-weight: 600;
  }
  #msg b { color: #f6ecda; font-size: 26px; display: block; margin-bottom: 8px; letter-spacing: .04em; }
  #msg .dim { color: #5b657a; font-weight: 500; }
  /* The lights. Big, brief, and the only thing on screen while they are up. */
  #msg b.light { font-size: 74px; line-height: 1; color: #ff5f47; letter-spacing: 0; }
  #msg b.light.go { color: #7fe08a; font-size: 52px; }
  /* The championship table. */
  #msg .table {
    display: inline-flex; flex-direction: column; gap: 2px; margin-top: 10px;
    font: 500 12px/1.6 Helvetica, Arial, sans-serif; letter-spacing: .08em; color: #7d879a;
  }
  #msg .table span { display: flex; justify-content: space-between; gap: 26px; min-width: 170px; }
  #msg .table span b { display: inline; font-size: 12px; margin: 0; color: #9aa5b8; }
  #msg .table .you { color: #f6ecda; }
  #msg .table .you b { color: #f6ecda; }

  /* the camera cluster, small and out of the way */
  #cam { right: 30px; bottom: 26px; display: flex; gap: 5px; pointer-events: auto; opacity: .5; transition: opacity .15s; }
  #cam:hover { opacity: 1; }
  #cam button {
    width: 30px; height: 26px; border: 1px solid #2b3547; border-radius: 3px;
    background: rgba(10, 15, 26, .5); color: #8d97ab; font: inherit; font-size: 11px;
    cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #cam button:hover { color: #ffd9a0; border-color: #4a586e; }

  /* the key list is OFF by default. It was the single most cluttering thing on
     screen and you only need it once. */
  #help {
    right: 30px; bottom: 62px; text-align: right; color: #78839a;
    font-size: 11px; line-height: 1.9; letter-spacing: .04em;
  }
  #help.hidden { display: none; }
  #help b { color: #ffd9a0; font-weight: 600; }
  #hint { right: 30px; bottom: 62px; font-size: 10px; letter-spacing: .18em; color: #4d566a; }
  #hint.hidden { display: none; }

  #back {
    left: 30px; top: 62px; pointer-events: auto; color: #5d6678;
    text-decoration: none; letter-spacing: .12em; font-size: 10px; font-weight: 600;
  }
  #back:hover { color: #ffd9a0; }

  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 10px;
    background: #05070d; color: #8f9bb3; text-align: center;
    font: 13px/1.7 ui-monospace, Menlo, Consolas, monospace;
    transition: opacity .6s ease;
  }
  body.booted #boot { opacity: 0; pointer-events: none; }
  #boot small { color: #5a6379; display: block; max-width: 44ch; }
  #boot.failed { color: #e08c74; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <div id="where"><div id="circuit"></div><div id="sect"></div></div>
  <a id="back" href="./index.html">&larr; back to the block</a>
  <div id="dash"><div id="speed">0</div><div id="gear"></div><div id="drift">drift</div></div>
  <div id="clock"><div id="time">0.00</div><div id="delta"></div><div id="lap"></div><div id="best"></div><div id="pos"></div></div>
  <div id="board"></div>
  <canvas id="map" width="150" height="150"></canvas>
  <div id="msg"></div>
  <div id="introcard" class="hidden"></div>
  <div id="results" class="hidden"></div>
  <div id="cam">
    <button id="camL" title="look left (q)">&#9668;</button>
    <button id="camB" title="look behind (v)">&#8635;</button>
    <button id="camR" title="look right (e)">&#9658;</button>
    <button id="zOut" title="zoom out">&minus;</button>
    <button id="zIn" title="zoom in">+</button>
  </div>
  <div id="help" class="hidden">
    <b>w</b> throttle &nbsp; <b>s</b> brake &nbsp; <b>a</b>/<b>d</b> steer<br>
    <b>space</b> drift &mdash; hold it to bank a boost<br>
    <b>s</b> at a stop &rarr; reverse<br>
    <b>q</b>/<b>e</b> look &nbsp; <b>v</b> behind &nbsp; <b>scroll</b> zoom<br>
    <b>g</b> garage &nbsp; <b>m</b> sound &nbsp; <b>r</b> reset
  </div>
  <div id="hint"><b>h</b> &mdash; controls</div>
</div>
<div id="boot"><div>building the circuit…</div><small id="bootmsg"></small><div id="boottrack"><div id="bootbar"></div></div></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
<script type="module" src="./src/race/main.js"></script>

<!-- Boot watchdog. A module that fails to evaluate leaves a page that looks
     fine and does nothing at all, with no error anywhere the user can see. -->
<script>
(function () {
  var boot = document.getElementById('boot'), msg = document.getElementById('bootmsg');
  function fail(why) {
    boot.classList.add('failed');
    boot.firstElementChild.textContent = 'it did not start';
    msg.textContent = why;
  }
  addEventListener('error', function (e) {
    if (!window.DYNAMO) fail((e.message || 'script error') + (e.filename ? ' — ' + e.filename.split('/').pop() : ''));
  }, true);
  if (location.protocol === 'file:') fail('opened over file:// — ES modules are blocked. Serve it: npm run dev');
  // The build is async now and narrates its progress by bumping __BUILD_BEAT;
  // a page is only dead if there is no DYNAMO and no heartbeat either.
  var iv = setInterval(function () {
    if (window.DYNAMO) { clearInterval(iv); return; }
    var beat = window.__BUILD_BEAT || 0;
    if (Date.now() - beat > 10000 && performance.now() > 10000) {
      clearInterval(iv);
      fail('module never evaluated — check the console');
    }
  }, 2500);
})();
</script>
</body>
</html>
