<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DYNAMO — the circuit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #cfd6e4; letter-spacing: .05em; text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  #ui > * { position: absolute; }

  /* speed and the lamp, bottom left — the two numbers the game is about */
  #dash { left: 24px; bottom: 22px; display: grid; gap: 8px; }
  #speed { font-size: 46px; line-height: .9; color: #f3e6cf; letter-spacing: .02em; }
  #speed::after { content: ' km/h'; font-size: 12px; color: #7d8799; letter-spacing: .16em; }
  #lap { font-size: 11px; color: #9fb0c8; letter-spacing: .16em; margin-top: 2px; }

  #clock { right: 24px; top: 20px; text-align: right; }
  #time { font-size: 34px; line-height: 1; color: #f3e6cf; }
  #best { font-size: 11px; color: #7d8799; letter-spacing: .16em; }

  #sect { left: 24px; top: 20px; font-size: 12px; color: #9fb0c8; letter-spacing: .18em; }
  #sect.dark { color: #ffb45c; }

  #msg {
    left: 50%; top: 46%; transform: translate(-50%, -50%); text-align: center;
    font-size: 15px; letter-spacing: .18em; color: #cfd6e4;
  }
  #msg b { color: #f3e6cf; font-size: 30px; display: block; margin-bottom: 6px; letter-spacing: .04em; }
  #msg .pb { color: #ffb45c; }
  #msg .dim { color: #5b657a; }

  #gear {
    color: #ffd9a0; letter-spacing: .3em; font-size: 15px; min-height: 18px;
  }
  #drift {
    color: #ff8a4c; letter-spacing: .34em; font-size: 11px; margin-top: 2px;
    opacity: 0; transition: opacity .12s;
  }
  #drift.on { opacity: 1; }

  #pos { color: #9ce0a8; letter-spacing: .18em; font-size: 13px; margin-top: 4px; }
  #pos.behind { color: #ff8a6a; }

  #cam {
    right: 24px; bottom: 126px; display: flex; gap: 6px; pointer-events: auto;
  }
  #cam button {
    width: 34px; height: 30px; border: 1px solid #2b3547; border-radius: 4px;
    background: rgba(10, 15, 26, .62); color: #8d97ab; font: inherit; font-size: 12px;
    cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #cam button:hover { color: #ffd9a0; border-color: #4a586e; }
  #cam .lbl { align-self: center; margin-right: 4px; opacity: .45; font-size: 9px; letter-spacing: .18em; }

  #help { right: 24px; bottom: 22px; text-align: right; opacity: .5; line-height: 1.8; }
  #help.hidden { display: none; }
  #help b { color: #ffd9a0; font-weight: 600; }
  #back {
    left: 24px; top: 48px; pointer-events: auto; color: #7d8799;
    text-decoration: none; letter-spacing: .16em; font-size: 10px;
  }
  #back:hover { color: #ffd9a0; }

  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 10px;
    background: #05070d; color: #8f9bb3; text-align: center;
    font: 13px/1.7 ui-monospace, Menlo, Consolas, monospace;
    transition: opacity .6s ease;
  }
  body.booted #boot { opacity: 0; pointer-events: none; }
  #boot small { color: #5a6379; display: block; max-width: 44ch; }
  #boot.failed { color: #e08c74; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <div id="sect"></div>
  <a id="back" href="./index.html">&larr; back to the block</a>
  <div id="dash"><div id="speed">0</div><div id="gear"></div><div id="drift">DRIFT</div></div>
  <div id="clock"><div id="time">0.00</div><div id="best"></div><div id="lap"></div><div id="pos"></div></div>
  <div id="msg">accelerate to start</div>
  <div id="cam">
    <span class="lbl">CAM</span>
    <button id="camL" title="look left (q)">&#9668;</button>
    <button id="camB" title="look behind (v)">&#8635;</button>
    <button id="camR" title="look right (e)">&#9658;</button>
    <button id="zOut" title="zoom out">&minus;</button>
    <button id="zIn" title="zoom in">+</button>
  </div>
  <div id="help">
    <b>w</b> throttle &nbsp; <b>s</b> brake &nbsp; <b>a</b>/<b>d</b> steer<br>
    <b>space</b> drift &nbsp; <b>s</b> held at a stop &rarr; reverse<br>
    <b>q</b>/<b>e</b> look &nbsp; <b>v</b> look back<br>
    <b>scroll</b> zoom &nbsp;
    <b>g</b> garage &nbsp; <b>x</b> weather &nbsp; <b>m</b> sound &nbsp; <b>c</b> repaint &nbsp; <b>r</b> reset &nbsp; <b>h</b> hide<br>
    <span style="opacity:.7">console: <b>DYNAMO.sim()</b></span>
  </div>
</div>
<div id="boot"><div>building the circuit…</div><small id="bootmsg"></small></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
<script type="module" src="./src/race/main.js"></script>

<!-- Boot watchdog. A module that fails to evaluate leaves a page that looks
     fine and does nothing at all, with no error anywhere the user can see. -->
<script>
(function () {
  var boot = document.getElementById('boot'), msg = document.getElementById('bootmsg');
  function fail(why) {
    boot.classList.add('failed');
    boot.firstElementChild.textContent = 'it did not start';
    msg.textContent = why;
  }
  addEventListener('error', function (e) {
    if (!window.DYNAMO) fail((e.message || 'script error') + (e.filename ? ' — ' + e.filename.split('/').pop() : ''));
  }, true);
  if (location.protocol === 'file:') fail('opened over file:// — ES modules are blocked. Serve it: npm run dev');
  setTimeout(function () { if (!window.DYNAMO) fail('module never evaluated after 10s — check the console'); }, 10000);
})();
</script>
</body>
</html>
