<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DYNAMO — the circuit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  /* THE DASH.
     The old one was a debug overlay wearing a HUD's clothes: every key in the
     game listed in the corner, a console hint on screen, and everything in
     letterspaced uppercase monospace including things that are not text. This
     is meant to read as an instrument binnacle from 1986 — a big soft-edged
     speed readout, a small amber strip for the lap, and nothing else unless
     you ask for it. */
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font: 500 12px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #b9c3d4;
    text-shadow: 0 1px 4px rgba(0,0,0,.85);
  }
  #ui > * { position: absolute; }

  /* speed, bottom left, on its own and large enough to read peripherally */
  #dash { left: 30px; bottom: 26px; }
  #speed {
    font: 300 62px/.82 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #f6ecda; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  #speed::after {
    content: 'km/h'; font-size: 11px; font-weight: 600; color: #6d7688;
    letter-spacing: .22em; margin-left: 9px; vertical-align: 14px;
  }
  #gear { color: #ffc98a; font: 600 14px/1 sans-serif; letter-spacing: .3em; min-height: 15px; margin-top: 7px; }
  #drift {
    color: #ff9a5c; font: 700 10px/1 sans-serif; letter-spacing: .4em;
    opacity: 0; transition: opacity .1s; margin-top: 3px;
  }
  #drift.on { opacity: 1; }
  #drift.t1 { color: #6fa8ff; }
  #drift.t2 { color: #ffa04c; }
  #drift.t3 { color: #d182ff; }

  /* the lap strip, top right */
  #clock { right: 30px; top: 24px; text-align: right; }
  #time {
    font: 300 34px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #f6ecda; font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  #lap { font-size: 10px; font-weight: 600; letter-spacing: .28em; color: #7f8a9c; margin-top: 4px; }
  #best { font-size: 10px; color: #5d6678; letter-spacing: .1em; margin-top: 3px; }
  #pos { font: 700 12px/1 sans-serif; letter-spacing: .16em; color: #9ce0a8; margin-top: 8px; }
  #pos.behind { color: #ff8a6a; }

  /* where you are, top left, quiet unless the lights are out */
  #where { left: 30px; top: 24px; }
  #circuit { font-size: 10px; font-weight: 700; letter-spacing: .3em; color: #6d7688; }
  #sect { font-size: 14px; font-weight: 500; letter-spacing: .06em; color: #aebbcd; margin-top: 4px; }
  #sect.dark { color: #ffb45c; }
  #sect.dark::after { content: ' \00b7 no lights'; font-size: 10px; letter-spacing: .18em; opacity: .75; }

  #msg {
    left: 0; right: 0; top: 42%; text-align: center; color: #93a0b4;
    font-size: 13px; letter-spacing: .22em; font-weight: 600;
  }
  #msg b { color: #f6ecda; font-size: 26px; display: block; margin-bottom: 8px; letter-spacing: .04em; }
  #msg .dim { color: #5b657a; font-weight: 500; }

  /* the camera cluster, small and out of the way */
  #cam { right: 30px; bottom: 26px; display: flex; gap: 5px; pointer-events: auto; opacity: .5; transition: opacity .15s; }
  #cam:hover { opacity: 1; }
  #cam button {
    width: 30px; height: 26px; border: 1px solid #2b3547; border-radius: 3px;
    background: rgba(10, 15, 26, .5); color: #8d97ab; font: inherit; font-size: 11px;
    cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #cam button:hover { color: #ffd9a0; border-color: #4a586e; }

  /* the key list is OFF by default. It was the single most cluttering thing on
     screen and you only need it once. */
  #help {
    right: 30px; bottom: 62px; text-align: right; color: #78839a;
    font-size: 11px; line-height: 1.9; letter-spacing: .04em;
  }
  #help.hidden { display: none; }
  #help b { color: #ffd9a0; font-weight: 600; }
  #hint { right: 30px; bottom: 62px; font-size: 10px; letter-spacing: .18em; color: #4d566a; }
  #hint.hidden { display: none; }

  #back {
    left: 30px; top: 62px; pointer-events: auto; color: #5d6678;
    text-decoration: none; letter-spacing: .12em; font-size: 10px; font-weight: 600;
  }
  #back:hover { color: #ffd9a0; }

  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 10px;
    background: #05070d; color: #8f9bb3; text-align: center;
    font: 13px/1.7 ui-monospace, Menlo, Consolas, monospace;
    transition: opacity .6s ease;
  }
  body.booted #boot { opacity: 0; pointer-events: none; }
  #boot small { color: #5a6379; display: block; max-width: 44ch; }
  #boot.failed { color: #e08c74; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <div id="where"><div id="circuit"></div><div id="sect"></div></div>
  <a id="back" href="./index.html">&larr; back to the block</a>
  <div id="dash"><div id="speed">0</div><div id="gear"></div><div id="drift">drift</div></div>
  <div id="clock"><div id="time">0.00</div><div id="lap"></div><div id="best"></div><div id="pos"></div></div>
  <div id="msg">accelerate to start</div>
  <div id="cam">
    <button id="camL" title="look left (q)">&#9668;</button>
    <button id="camB" title="look behind (v)">&#8635;</button>
    <button id="camR" title="look right (e)">&#9658;</button>
    <button id="zOut" title="zoom out">&minus;</button>
    <button id="zIn" title="zoom in">+</button>
  </div>
  <div id="help" class="hidden">
    <b>w</b> throttle &nbsp; <b>s</b> brake &nbsp; <b>a</b>/<b>d</b> steer<br>
    <b>space</b> drift &mdash; hold it to bank a boost<br>
    <b>s</b> at a stop &rarr; reverse<br>
    <b>q</b>/<b>e</b> look &nbsp; <b>v</b> behind &nbsp; <b>scroll</b> zoom<br>
    <b>g</b> garage &nbsp; <b>m</b> sound &nbsp; <b>r</b> reset
  </div>
  <div id="hint"><b>h</b> &mdash; controls</div>
</div>
<div id="boot"><div>building the circuit…</div><small id="bootmsg"></small></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
<script type="module" src="./src/race/main.js"></script>

<!-- Boot watchdog. A module that fails to evaluate leaves a page that looks
     fine and does nothing at all, with no error anywhere the user can see. -->
<script>
(function () {
  var boot = document.getElementById('boot'), msg = document.getElementById('bootmsg');
  function fail(why) {
    boot.classList.add('failed');
    boot.firstElementChild.textContent = 'it did not start';
    msg.textContent = why;
  }
  addEventListener('error', function (e) {
    if (!window.DYNAMO) fail((e.message || 'script error') + (e.filename ? ' — ' + e.filename.split('/').pop() : ''));
  }, true);
  if (location.protocol === 'file:') fail('opened over file:// — ES modules are blocked. Serve it: npm run dev');
  setTimeout(function () { if (!window.DYNAMO) fail('module never evaluated after 10s — check the console'); }, 10000);
})();
</script>
</body>
</html>
